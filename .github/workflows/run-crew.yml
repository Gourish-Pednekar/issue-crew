name: Run crew on issue

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number on the target repo"
        required: true
      dry_run:
        description: "Dry run (no push, no PR, no comment)"
        type: boolean
        default: true

jobs:
  crew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: docker build -t issue-crew-sandbox sandbox
      - name: Run crew
        env:
          ISSUE: ${{ inputs.issue }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.CREW_GITHUB_TOKEN }}
          MODEL: openai/gpt-oss-120b
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python issue_to_pr.py "$ISSUE" --dry-run
          else
            python issue_to_pr.py "$ISSUE"
          fi
